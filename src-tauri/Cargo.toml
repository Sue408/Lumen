[package]
name = "lumen"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
tauri-plugin-updater = "2.11.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# 体积优先：全局 opt-level = "s"，但网关热路径（HTTP 转发、JSON、SQLite）单独保留
# opt-level = 3，避免以吞吐换取体积。webview2 / wry / tao 等体积大头仍走 "s"。
[profile.release.package.reqwest]
opt-level = 3

[profile.release.package.tokio]
opt-level = 3

[profile.release.package.hyper]
opt-level = 3

[profile.release.package.hyper-util]
opt-level = 3

[profile.release.package.axum]
opt-level = 3

[profile.release.package.tower]
opt-level = 3

[profile.release.package.serde_json]
opt-level = 3

[profile.release.package.rusqlite]
opt-level = 3

[profile.release.package.libsqlite3-sys]
opt-level = 3
